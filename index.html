<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KingMiso 👑 | 나만의 작은 왕국</title>
    <meta name="description" content="귀여운 미소와 함께 나만의 왕국을 건설하세요! 자원을 모으고 영웅을 육성하며 신비로운 탑을 정복하는 판타지 왕국 RPG.">
    <link rel="canonical" href="https://kingmiso.github.io/kingmiso-test/">
    
    <!-- Social link previews -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:site_name" content="KingMiso">
    <meta property="og:title" content="KingMiso 👑 | 나만의 작은 왕국">
    <meta property="og:description" content="미소와 함께 왕국을 성장시키세요! 자원 수집, 영웅 육성, 장비 강화, 신비로운 탑 전투까지. 지금 나만의 판타지 왕국을 시작하세요!">
    <meta property="og:url" content="https://kingmiso.github.io/kingmiso-test/">
    <meta property="og:image" content="https://kingmiso.github.io/kingmiso-test/og-image.jpg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000; /* 데스크탑 등 넓은 화면에서 보여질 여백 배경색 */
            margin: 0; 
            padding: 0; 
            width: 100vw;
            min-height: 100dvh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* 모바일(iPhone) 기준 게임 셸 화면 */
        #game-shell {
            position: relative;
            width: 100%;
            max-width: 430px; /* 아이폰 Pro Max 해상도 대응 */
            height: 100dvh;
            background-color: #0f172a;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        .font-chewy { font-family: 'Chewy', cursive; }
        input, select, textarea { font-size: 16px !important; }

        /* 상단 HUD (재화 바) - 맵 위에 자연스럽게 오버레이 */
        .top-bar { 
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.75) 60%, transparent 100%);
            padding: 8px 6px 16px 6px; 
            display: flex; 
            flex-direction: column;
            gap: 3px;
            position: absolute; 
            top: 0; 
            left: 0;
            width: 100%;
            z-index: 30; 
            pointer-events: none; /* 클릭 관통 */
        }
        .top-bar > * { pointer-events: auto; } /* 내부 버튼들은 클릭 가능하도록 처리 */

        .resource-item { display: flex; align-items: center; gap: 3px; font-weight: bold; font-size: 0.675rem; white-space: nowrap; }
        .resource-item.gold { color: #fbbf24; }
        .resource-item.puregold { color: #f59e0b; }
        .resource-item.emerald { color: #10b981; }
        .resource-item.ruby { color: #ef4444; }
        .resource-item.sapphire { color: #3b82f6; }
        .resource-item.food { color: #f87171; }
        .resource-item.wood { color: #d97706; }
        .resource-item.ore { color: #94a3b8; }
        .resource-item.herb { color: #34d399; }

        .km-resource-board { width:100%; display:flex; flex-direction:column; gap:3px; padding:3px 2px 1px; min-width:0; }
        .km-basic-resources { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:3px 4px; width:100%; min-width:0; }
        .km-rare-resources { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:3px; width:100%; min-width:0; border-top:1px solid rgba(255,255,255,0.1); padding-top:4px; margin-top:2px; }
        .km-resource-board .resource-item { min-width:0; width:100%; display:flex; justify-content:center; align-items:center; gap:4px; padding:3px 1px; border-radius:5px; background:rgba(30,41,59,.7); font-size:11px!important; font-variant-numeric:tabular-nums; overflow:hidden; border: 1px solid rgba(255,255,255,0.05); text-shadow: 0 1px 2px #000; }

        /* 메인 영지 화면 (연속적인 맵 씬) */
        #screen-domain {
            position: absolute;
            inset: 0;
            padding: 0 !important;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            z-index: 10;
            background: #020617;
            display: none;
        }
        #screen-domain.active { display: block; }

        .km-master-map {
            position: relative;
            width: 100%;
            height: 180vw; /* 마스터 이미지 비율에 맞춘 상하 스크롤 영역 */
            min-height: 850px;
            background: url('image_4.png') center top / cover no-repeat;
        }

        /* 맵 하단 그라데이션 (네비게이션 바와 자연스럽게 이어지도록) */
        .km-master-map::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 150px;
            background: linear-gradient(0deg, rgba(15,23,42,1) 0%, rgba(15,23,42,0) 100%);
            pointer-events: none;
        }

        /* 맵 핀 (건물 핫스팟) */
        .km-map-pin {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            background: transparent;
            border: none;
            z-index: 15;
            cursor: pointer;
            padding: 10px;
            -webkit-tap-highlight-color: transparent;
        }
        .km-pin-icon {
            width: 46px; height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(30,58,138,0.95), rgba(15,23,42,0.95));
            border: 2px solid #facc15;
            box-shadow: 0 6px 16px rgba(0,0,0,0.6), inset 0 0 12px rgba(250,204,21,0.4);
            color: #fde047;
            font-size: 20px;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .km-map-pin:active .km-pin-icon { 
            transform: scale(0.9); 
            box-shadow: 0 2px 8px rgba(0,0,0,0.8), inset 0 0 6px rgba(250,204,21,0.6);
        }
        .km-pin-label {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #94a3b8;
            color: #f8fafc;
            font-size: 11px;
            font-weight: 900;
            padding: 3px 10px;
            border-radius: 12px;
            white-space: nowrap;
            text-shadow: 0 1px 3px black;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
        }

        /* 하단 네비게이션 (맵 오버레이) */
        .bottom-wrapper {
            position: absolute; 
            bottom: 0; 
            left: 0;
            width: 100%; 
            z-index: 30; 
            background: linear-gradient(0deg, rgba(15,23,42,1) 60%, rgba(15,23,42,0.8) 100%);
            border-top: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
        }
        .bottom-nav { 
            display: flex; 
            justify-content: space-around; 
            padding: 8px 0 max(12px, env(safe-area-inset-bottom, 12px)) 0; 
        }
        .nav-btn { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: #94a3b8; 
            background: none; 
            border: none; 
            cursor: pointer; 
            transition: color 0.2s, transform 0.1s; 
            font-size: 0.65rem; 
            font-weight: 700;
            flex: 1; 
        }
        .nav-btn i { font-size: 1.25rem; margin-bottom: 3px; }
        .nav-btn.active { color: #facc15; transform: scale(1.08); text-shadow: 0 0 10px rgba(250,204,21,0.5); }

        /* 기타 탭 화면들 (채집, 영웅 등) */
        .screen-panel:not(#screen-domain) { 
            display: none; 
            position: absolute;
            top: 85px; 
            left: 0;
            width: 100%;
            bottom: calc(65px + env(safe-area-inset-bottom, 0px));
            padding: 12px; 
            overflow-y: auto;
            background: #0f172a;
        }
        .screen-panel:not(#screen-domain).active { display: block; }

        /* 공통 3D 버튼 스타일 */
        .btn-3d {
            border: none; padding: 8px 12px; border-radius: 10px; font-weight: bold; cursor: pointer;
            position: relative; color: white; text-shadow: 0 1px 1px rgba(0,0,0,0.4);
        }
        .btn-3d:active { transform: translateY(2px); box-shadow: none !important; }
        .btn-blue { background: linear-gradient(180deg, #38bdf8, #0369a1); box-shadow: 0 4px 0 #075985; }

    </style>
</head>
<body>
    <div id="game-shell">
        
        <!-- 상단 HUD (맵 위를 덮는 투명한 그라데이션 바) -->
        <div class="top-bar">
            <div class="flex justify-between items-center px-1 mb-1">
                <div class="flex items-center gap-2">
                    <img src="image_2.png" alt="Profile" class="w-8 h-8 rounded-full border-2 border-yellow-400 shadow-lg" style="object-fit: cover;">
                    <div class="text-white font-black text-sm drop-shadow-md">Lv.12 미소 왕국</div>
                </div>
                <button class="btn-3d btn-blue text-xs py-1 px-3"><i class="fas fa-plus"></i> 충전</button>
            </div>
            
            <div class="km-resource-board">
                <div class="km-basic-resources">
                    <div class="resource-item gold"><i class="fas fa-coins"></i><span>12.5K</span></div>
                    <div class="resource-item wood"><i class="fas fa-tree"></i><span>9.8K</span></div>
                    <div class="resource-item ore"><i class="fas fa-cubes"></i><span>6.4K</span></div>
                </div>
                <div class="km-rare-resources">
                    <div class="resource-item emerald"><i class="fas fa-gem"></i><span>3.2K</span></div>
                    <div class="resource-item ruby"><i class="fas fa-gem"></i><span>1.1K</span></div>
                    <div class="resource-item sapphire"><i class="fas fa-gem"></i><span>850</span></div>
                    <div class="resource-item food"><i class="fas fa-meat"></i><span>5.2K</span></div>
                </div>
            </div>
        </div>

        <!-- 1. 영지 화면 (마스터 맵 씬) -->
        <div id="screen-domain" class="screen-panel active">
            <div class="km-master-map">
                <!-- 상단 여백 (HUD가 건물을 가리지 않도록 공간 확보) -->
                <div style="height: 140px; pointer-events: none;"></div>

                <!-- 왕성 핀 -->
                <button class="km-map-pin" style="top: 25%; left: 50%;" onclick="alert('왕성 메뉴 열기')">
                    <div class="km-pin-icon" style="width: 54px; height: 54px; font-size: 24px;"><i class="fas fa-chess-rook"></i></div>
                    <div class="km-pin-label text-yellow-300">왕성 (Lv.12)</div>
                </button>

                <!-- 풍차 농장 핀 -->
                <button class="km-map-pin" style="top: 45%; left: 20%;">
                    <div class="km-pin-icon"><i class="fas fa-wheat"></i></div>
                    <div class="km-pin-label">풍차 농장 (Lv.8)</div>
                </button>

                <!-- 수정 광산 핀 -->
                <button class="km-map-pin" style="top: 48%; left: 82%;">
                    <div class="km-pin-icon"><i class="fas fa-gem"></i></div>
                    <div class="km-pin-label">수정 광산 (Lv.6)</div>
                </button>

                <!-- 중앙 광장 핀 -->
                <button class="km-map-pin" style="top: 60%; left: 50%;">
                    <div class="km-pin-icon"><i class="fas fa-monument"></i></div>
                    <div class="km-pin-label">영웅 광장</div>
                </button>

                <!-- 수력 대장간 핀 -->
                <button class="km-map-pin" style="top: 76%; left: 28%;">
                    <div class="km-pin-icon"><i class="fas fa-hammer"></i></div>
                    <div class="km-pin-label">대장간 (Lv.5)</div>
                </button>

                <!-- 훈련소 핀 -->
                <button class="km-map-pin" style="top: 72%; left: 74%;">
                    <div class="km-pin-icon"><i class="fas fa-khanda"></i></div>
                    <div class="km-pin-label">훈련소 (Lv.7)</div>
                </button>

                <!-- 하단 여백 (하단 네비게이션이 건물을 가리지 않도록 공간 확보) -->
                <div style="height: 120px; pointer-events: none; position: absolute; bottom: 0;"></div>
            </div>
        </div>

        <!-- 2. 채집 화면 (임시) -->
        <div id="screen-gather" class="screen-panel">
            <h2 class="text-white font-bold text-xl mb-4">채집</h2>
            <p class="text-slate-400 text-sm">월드 채집 화면입니다.</p>
        </div>

        <!-- 3. 영웅 화면 (임시) -->
        <div id="screen-heroes" class="screen-panel">
            <h2 class="text-white font-bold text-xl mb-4">영웅 관리</h2>
            <p class="text-slate-400 text-sm">영웅 덱 설정 및 육성 화면입니다.</p>
        </div>

        <!-- 4. 전투 화면 (임시) -->
        <div id="screen-battle" class="screen-panel">
            <h2 class="text-white font-bold text-xl mb-4">전투</h2>
            <p class="text-slate-400 text-sm">스테이지 전투 화면입니다.</p>
        </div>

        <!-- 5. 상점 화면 (임시) -->
        <div id="screen-shop" class="screen-panel">
            <h2 class="text-white font-bold text-xl mb-4">상점</h2>
            <p class="text-slate-400 text-sm">아이템 및 패키지 상점 화면입니다.</p>
        </div>

        <!-- 하단 네비게이션 탭 -->
        <div class="bottom-wrapper">
            <div class="bottom-nav">
                <button class="nav-btn active" onclick="switchScreen('domain')">
                    <i class="fas fa-chess-rook"></i>
                    <span>영지</span>
                </button>
                <button class="nav-btn" onclick="switchScreen('gather')">
                    <i class="fas fa-pickaxe"></i>
                    <span>채집</span>
                </button>
                <button class="nav-btn" onclick="switchScreen('heroes')">
                    <i class="fas fa-users"></i>
                    <span>영웅</span>
                </button>
                <button class="nav-btn" onclick="switchScreen('battle')">
                    <i class="fas fa-swords"></i>
                    <span>전투</span>
                </button>
                <button class="nav-btn" onclick="switchScreen('shop')">
                    <i class="fas fa-store"></i>
                    <span>상점</span>
                </button>
            </div>
        </div>

    </div>

    <script>
        // 하단 탭 전환 스크립트
        function switchScreen(screenName) {
            document.querySelectorAll('.screen-panel').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            if(document.getElementById('screen-' + screenName)) {
                document.getElementById('screen-' + screenName).classList.add('active');
            }
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
